<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live bin sensor</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --ink: #17201c; --muted: #5e6b65; --line: #dfe5e2;
    --ok: #1f9d55; --warn: #c98a00; --full: #c93030;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111614; --card: #1a211e; --ink: #e8efeb; --muted: #9aa8a1; --line: #2a332f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.25rem; margin: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 640px) { .top { grid-template-columns: 1fr; } }
  .pct { font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .bar { height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; margin: 16px 0 12px; }
  .bar > div { height: 100%; width: 0; border-radius: 9px; transition: width .6s ease, background .6s ease; }
  .status { font-weight: 600; }
  .tag { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px;
         font-size: 0.8rem; color: var(--muted); margin: 2px 4px 2px 0; }
  img { width: 100%; border-radius: 10px; display: block; background: var(--line); aspect-ratio: 16 / 9; object-fit: cover; }
  .nophoto { aspect-ratio: 16 / 9; display: grid; place-items: center; border: 1px dashed var(--line);
             border-radius: 10px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Live bin sensor <span id="bin" class="muted"></span></h1>
    <span id="when" class="muted">waiting for the first reading...</span>
  </header>

  <section class="top">
    <div class="card">
      <div class="pct"><span id="pct">--</span>%</div>
      <div class="bar"><div id="fill"></div></div>
      <div id="status" class="status"></div>
      <p id="reason" class="muted"></p>
      <div id="tags"></div>
    </div>
    <div class="card">
      <img id="photo" alt="Latest photo from the bin camera" hidden>
      <div id="nophoto" class="nophoto">no photo for this reading</div>
    </div>
  </section>

  <section class="card">
    <strong>Readings</strong>
    <div class="scroll">
      <table>
        <thead><tr><th>Time</th><th>Bin</th><th>Fill</th><th>Rate (%/h)</th><th>Emptied</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let shown = null;

  function level(pct) {
    if (pct >= 80) return ["var(--full)", "Full: schedule a pickup"];
    if (pct >= 50) return ["var(--warn)", "Filling up"];
    return ["var(--ok)", "Plenty of room"];
  }

  async function refresh() {
    try {
      const latest = await (await fetch("/api/latest")).json();
      if (latest && latest.timestamp !== shown) {
        shown = latest.timestamp;
        const pct = Number(latest.fill_pct);
        const [color, text] = level(pct);
        $("pct").textContent = pct;
        $("fill").style.width = pct + "%";
        $("fill").style.background = color;
        $("status").textContent = text;
        $("status").style.color = color;
        $("reason").textContent = latest.reason || "";
        $("bin").textContent = latest.bin_id;
        $("when").textContent = "last reading " + latest.timestamp;
        const tags = [latest.source === "manual" ? "manual reading" : "camera reading"];
        if (latest.confidence) tags.push(latest.confidence + " confidence");
        if (latest.ai_model) tags.push(latest.ai_model);
        $("tags").replaceChildren(...tags.map((t) => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = t;
          return span;
        }));
        $("photo").hidden = !latest.has_photo;
        $("nophoto").hidden = !!latest.has_photo;
        if (latest.has_photo) $("photo").src = "/photo/latest.jpg?t=" + encodeURIComponent(latest.timestamp);

        const rows = await (await fetch("/api/history")).json();
        $("rows").replaceChildren(...rows.slice(-12).reverse().map((r) => {
          const tr = document.createElement("tr");
          for (const value of [r.timestamp, r.bin_id, r.fill_pct + "%", r.fill_rate_pct_per_hr,
                               r.collection_occurred === "True" ? "yes" : ""]) {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          }
          return tr;
        }));
      }
    } catch (error) {
      $("when").textContent = "sensor offline";
    }
  }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
